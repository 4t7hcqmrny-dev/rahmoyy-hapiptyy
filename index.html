<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Website</title>
    <style>
        body {
            background-color: #ffcccb;
            color: #800000;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        h1 {
            font-size: 48px;
        }
        p {
            font-size: 24px;
        }
        #content {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Welcome to Your Love Website!</h1>
    <div id="passwordForm">
        <input type="password" id="password" placeholder="Enter Password" />
        <button onclick="checkPassword()">Submit</button>
    </div>
    <div id="content">
        <p>Here is a beautiful love message for you.</p>
        <p>Love is not about how much you say 'I love you', but how much you prove that it's true.</p>
    </div>

    <script>
        function checkPassword() {
            var password = document.getElementById("password").value;
            if (password === "your_password") { // Change 'your_password' to the desired password
                document.getElementById("passwordForm").style.display = "none";
                document.getElementById("content").style.display = "block";
            } else {
                alert("Incorrect Password. Try Again!");
            }
        }
    </script>

</body>
</html>
